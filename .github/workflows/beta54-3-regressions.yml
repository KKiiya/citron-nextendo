name: Beta54.3 focused regressions
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/beta54_3/**'
      - '.github/workflows/beta54-3-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install JSON headers
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
      - name: Configure
        run: cmake -S tests/beta54_3 -B build/beta54_3-tests -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/beta54_3-tests --parallel 2
      - name: Test
        run: ctest --test-dir build/beta54_3-tests --output-on-failure
