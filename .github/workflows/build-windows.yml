name: Build Citron NPLN catalog trial

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: npln-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-catalog:
    if: github.ref_name == 'npln-catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test signed patch manifests
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev nlohmann-json3-dev
          g++ -std=c++20 -Isrc test-files/npln_patch_catalog_test.cpp src/web_service/npln_patch_manifest.cpp -lcrypto -o /tmp/test-catalog
          /tmp/test-catalog
          curl --fail --silent --show-error --max-time 30 -A citron https://nextendo.network/service-catalog/v1/npln-patches -o /tmp/catalog.json
          /tmp/test-catalog /tmp/catalog.json 'LAI+Pi+GZtj3p4DpNM5ORBraw1cbZCVSMFgUmAVWNeA='

  build-windows:
    needs: test-catalog
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      CPM_SOURCE_CACHE: /d/npln-cpm
      CITRON_USE_AUTO_UPDATER: 'OFF'
    steps:
      - name: Enable long Git paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install Visual Studio clang-cl
        shell: powershell
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          & $installer modify --installPath "$installation" --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --quiet --norestart --wait
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { throw "Visual Studio installation failed: $LASTEXITCODE" }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-nasm
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sccache
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Verify native Perl
        shell: bash
        run: test -x /c/Strawberry/perl/bin/perl.exe
      - uses: actions/cache@v4
        with:
          path: D:/npln-cpm
          key: npln-catalog-clangcl-${{ runner.os }}-${{ hashFiles('CMakeModules/dependencies.cmake', 'build-clangtron-windows.sh') }}
          restore-keys: npln-catalog-clangcl-${{ runner.os }}-
      - name: Prepare build environment
        shell: msys2 {0}
        run: |
          chmod +x build-clangtron-windows.sh
          PYTHON_EXECUTABLE="$(cygpath -u '${{ steps.python.outputs.python-path }}')" ./build-clangtron-windows.sh setup --compiler clang-cl
      - name: Configure Nextendo client identity
        shell: python
        env:
          NEXTENDO_CLIENT_ID: ${{ secrets.NEXTENDO_CLIENT_ID }}
        run: |
          import json
          import os
          from pathlib import Path
          client_id = os.environ.get('NEXTENDO_CLIENT_ID', '')
          if not client_id:
              raise SystemExit('NEXTENDO_CLIENT_ID is required')
          header = '#pragma once\n\nnamespace WebService::NextendoApi {\nconstexpr const char* AppClientId = ' + json.dumps(client_id) + ';\n}\n'
          Path('src/web_service/nextendo_secrets.h').write_text(header, encoding='utf-8')
      - name: Build Citron
        shell: msys2 {0}
        run: |
          export CITRON_BUILD_TYPE=Nightly
          export PYTHON_EXECUTABLE="$(cygpath -u '${{ steps.python.outputs.python-path }}')"
          ./build-clangtron-windows.sh use --compiler clang-cl --pgo none --lto none --no-unity --jobs 4 --no-tracy --no-tracy-alloc
      - name: Verify and package trial
        shell: pwsh
        run: |
          $cache = Get-Content build/clang-cl/.work/use/CMakeCache.txt
          if (-not ($cache -match '^CITRON_USE_AUTO_UPDATER:BOOL=OFF$')) { throw 'Trial updater must be disabled' }
          if (-not ($cache -match '^ENABLE_WEB_SERVICE:BOOL=ON$')) { throw 'Web service must be enabled' }
          $output = Resolve-Path build/clang-cl/use
          if (-not (Test-Path "$output/citron.exe")) { throw 'Citron executable is missing' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zip = "$env:GITHUB_WORKSPACE/dist/Citron-npln-catalog-${{ steps.version.outputs.version }}-windows-x64.zip"
          & 7z a -tzip $zip "$output/*" '-xr!CMakeFiles' '-x!CMakeCache.txt' '-x!build.ninja' '-x!cmake_install.cmake' '-xr!user' '-xr!backup' '-xr!nextendo_secrets.h'
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Citron-npln-catalog-Windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
